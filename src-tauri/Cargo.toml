[package]
name = "paperwork-studio"
version = "0.2.7"
description = "Paperwork PDF Studio desktop host"
authors = ["PDF Factory"]
edition = "2021"
rust-version = "1.88"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
rfd = "0.15"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
open = "5"
dunce = "1"
native-support = { path = "native-support" }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "io-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinHttp"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
opt-level = "s"
lto = "thin"
codegen-units = 1
